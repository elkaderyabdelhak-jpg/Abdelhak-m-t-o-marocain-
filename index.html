<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meteo Maroc - Glass Green</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Outfit',sans-serif}
body{min-height:100vh;background:#0F5D50;display:flex;justify-content:center;padding:0;overflow-x:hidden}
/* SPLASH */
.splash{
  position:fixed;top:0;left:0;width:100%;height:100vh;
  background: linear-gradient(180deg, #0F5D50 0%, #2E9B8B 60%, #7AC7A0 100%);
  z-index:9999;display:flex;flex-direction:column;
  justify-content:center;align-items:center;
  color:#fff;transition:transform 0.8s ease, opacity 0.8s ease;
  text-align:center;
}
.splash.hide{transform:translateY(-100%);opacity:0;pointer-events:none}
.splash .glass{
  background: linear-gradient(135deg, rgba(255,255,255,0.35), rgba(255,255,255,0.15));
  backdrop-filter: blur(25px);border:1px solid rgba(255,255,255,0.3);
  border-radius:28px;padding:30px 25px;width:85%;max-width:340px;
}
.phone{
  width:100%;max-width:420px;min-height:100vh;
  background: linear-gradient(180deg, rgba(15,93,80,0.9) 0%, rgba(46,155,139,0.85) 30%, rgba(122,199,160,0.9) 100%);
  backdrop-filter: blur(20px);position:relative;padding:15px 18px 90px;
}
.top{display:flex;justify-content:space-between;align-items:center;color:#fff;padding:10px 0}
.top .loc{display:flex;gap:8px;align-items:center;font-size:18px;font-weight:500}
.top input{background:rgba(255,255,255,0.2);border:none;padding:8px 14px;border-radius:20px;color:#fff;width:140px;outline:none}
.top input::placeholder{color:rgba(255,255,255,0.7)}
.main-card{
  background: linear-gradient(135deg, rgba(255,255,255,0.35) 0%, rgba(255,255,255,0.15) 100%);
  backdrop-filter: blur(25px);border:1px solid rgba(255,255,255,0.3);
  border-radius:28px;padding:22px;margin-top:15px;text-align:center;color:#fff;
  box-shadow:0 10px 40px rgba(0,0,0,0.15);
}
.weather-icon{font-size:60px;filter:drop-shadow(0 0 20px rgba(255,255,255,0.5))}
.temp{font-size:78px;font-weight:700;line-height:1;color:#0D3B33;margin:10px 0 0}
.desc{font-size:22px;font-weight:500;margin-top:5px}
.sub{font-size:14px;opacity:0.9;margin-top:4px}
.stats{display:flex;gap:10px;margin-top:18px;background:rgba(255,255,255,0.25);border-radius:18px;padding:12px}
.stat{flex:1;display:flex;gap:10px;align-items:center;text-align:left}
.stat .ic{font-size:28px}
.stat b{font-size:16px;color:#0D3B33}
.stat span{font-size:12px;opacity:0.8;color:#0D3B33}
.section-title{color:rgba(255,255,255,0.8);letter-spacing:3px;font-size:13px;margin:25px 0 12px;text-align:center}
.day-row{background:rgba(255,255,255,0.28);backdrop-filter:blur(15px);border:1px solid rgba(255,255,255,0.2);border-radius:16px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;color:#0D3B33;font-weight:500}
.day-row .left{display:flex;gap:12px;align-items:center}
.bottom-nav{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);width:90%;max-width:380px;background:rgba(255,255,255,0.4);backdrop-filter:blur(25px);border-radius:22px;display:flex;justify-content:space-around;padding:14px 0;border:1px solid rgba(255,255,255,0.3)}
.nav-item{text-align:center;color:#0D3B33;opacity:0.5;font-size:12px}
.nav-item.active{opacity:1;color:#0F5D50;font-weight:700}
</style>
</head>
<body>

<div class="splash" id="splash">
  <div class="glass">
    <div style="font-size:80px">⛅</div>
    <h1 style="font-size:34px;line-height:1.2;margin-top:15px">Marhaba -<br>Meteo Maroc</h1>
    <p style="margin-top:12px;opacity:0.9;font-size:14px">Bienvenue • Prévisions météo en temps réel</p>
    <p style="margin-top:20px;font-size:12px;opacity:0.7">Chargement...</p>
  </div>
  <div style="margin-top:30px;font-size:12px;opacity:0.6">🏔️ Midelt - Atlas Mountains</div>
</div>

  <div class="top">
